<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Dashboard – SeePay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink:#0B2E21; --gold:#FFC83D; --bg:#F8FAF9; --card:#fff; --line:#E5E7EB; --mut:#6B7280; }
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); font-family:Inter,system-ui,sans-serif; color:#111; }
header { background:var(--ink); color:#fff; padding:1rem 1.5rem; display:flex; justify-content:space-between; align-items:center; }
header a { color:#fff; text-decoration:none; font-weight:600; }
.wrap { max-width:960px; margin:1.5rem auto; padding:0 1.5rem; }
.tabs { display:flex; gap:.5rem; margin-bottom:1.5rem; border-bottom:1px solid var(--line); }
.tabs button { background:none; border:none; padding:.6rem 1rem; font-weight:600; color:var(--mut); cursor:pointer; border-bottom:3px solid transparent; }
.tabs button.on { color:var(--ink); border-color:var(--gold); }
.card { background:var(--card); border-radius:16px; border:1px solid var(--line); padding:1.5rem; margin-bottom:1rem; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
@media(max-width:640px){ .grid{ grid-template-columns:1fr; } }
input, select, textarea { width:100%; padding:.7rem .9rem; border:1.5px solid var(--line); border-radius:10px; font-size:.95rem; }
.btn { background:var(--ink); color:#fff; border:none; padding:.65rem 1.1rem; border-radius:10px; font-weight:600; cursor:pointer; }
.btn.g { background:var(--gold); color:var(--ink); }
.list div { display:flex; justify-content:space-between; align-items:center; padding:.8rem 0; border-bottom:1px solid var(--line); }
.badge { padding:.2rem .55rem; border-radius:99px; font-size:.75rem; font-weight:600; }
.badge.wait { background:#FEF3C7; color:#92400E; }
</style>
</head>
<body>
<header>
  <strong id="shopName">My Shop</strong>
  <a href="/login.html" onclick="localStorage.removeItem('seepay_session')">Sign out</a>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="on" data-tab="products">Products</button>
    <button data-tab="orders">Orders</button>
    <button data-tab="settings">Settings</button>
  </div>
  <div id="content"></div>
</div>
<script>
var session = JSON.parse(localStorage.getItem('seepay_session') || 'null');
if (!session || session.role !== 'shop') location.href = '/login.html';
document.getElementById('shopName').textContent = session.id + '.seepay.shop';
var products = JSON.parse(localStorage.getItem('products_' + session.id) || '[]');
function renderProducts() {
  document.getElementById('content').innerHTML = `
    <div class="card">
      <h2 style="margin-bottom:1rem">Add product</h2>
      <div class="grid">
        <div><label style="font-size:.85rem;font-weight:600">Name</label><input id="pn" placeholder="Jollof + chicken"></div>
        <div><label style="font-size:.85rem;font-weight:600">Price (GH₵)</label><input id="pp" type="number" step="0.01" placeholder="35"></div>
      </div>
      <div style="margin-top:.75rem"><label style="font-size:.85rem;font-weight:600">Description</label><textarea id="pd" rows="2" placeholder="With shito and salad"></textarea></div>
      <button class="btn g" style="margin-top:1rem" onclick="addProduct()">Add product</button>
    </div>
    <div class="card">
      <h2 style="margin-bottom:.5rem">Your products (${products.length})</h2>
      <div class="list" id="plist">${products.map(p => `
        <div>
          <div><b>${p.name}</b><div style="color:#6B7280;font-size:.85rem">${p.desc || ''}</div></div>
          <div style="display:flex;gap:.5rem;align-items:center">
            <b>GH₵ ${p.price}</b>
            <button class="btn" style="padding:.3rem .6rem;font-size:.8rem" onclick="delProduct('${p.id}')">Delete</button>
          </div>
        </div>`).join('') || '<div style="color:#6B7280">No products yet.</div>'}</div>
    </div>`;
}
function addProduct() {
  var name = document.getElementById('pn').value.trim();
  var price = parseFloat(document.getElementById('pp').value);
  var desc = document.getElementById('pd').value.trim();
  if (!name || !price) return alert('Enter name and price');
  products.push({ id: Date.now().toString(), name, price, desc });
  localStorage.setItem('products_' + session.id, JSON.stringify(products));
  renderProducts();
}
function delProduct(id) {
  products = products.filter(p => p.id !== id);
  localStorage.setItem('products_' + session.id, JSON.stringify(products));
  renderProducts();
}
function renderOrders() {
  document.getElementById('content').innerHTML = `<div class="card"><h2>Orders</h2><p style="color:#6B7280;margin-top:.5rem">Orders will appear here once customers start paying.</p></div>`;
}
function renderSettings() {
  document.getElementById('content').innerHTML = `
    <div class="card">
      <h2>Shop settings</h2>
      <p style="color:#6B7280;margin:.75rem 0">Verification status: <span class="badge wait">Pending</span></p>
      <p style="font-size:.9rem">Pay the GH₵ 150 setup fee to go live. (Demo)</p>
      <button class="btn" style="margin-top:1rem" onclick="alert('Setup fee payment will connect to Paystack soon')">Pay setup fee</button>
    </div>`;
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = function() {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
  this.classList.add('on');
  if (this.dataset.tab === 'products') renderProducts();
  if (this.dataset.tab === 'orders') renderOrders();
  if (this.dataset.tab === 'settings') renderSettings();
});
renderProducts();
</script>
</body>
</html>
